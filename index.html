<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            grid-template-rows: 2fr 2fr 0.5fr;
            min-height: 100vh;
        }

        .top {
            background: linear-gradient(
                to bottom,
                #808080 0,
                #808080 17.5%,
                #000000 17.5%,
                #000000 100%
            );
        }

        .white {
            background: #ffffff;
        }

        .bottom {
            background: #000000;
        }
    </style>
</head>

<body>

    <div class="top"></div>
    <div class="white"></div>
    <div class="bottom"></div>

</body>
</html>
