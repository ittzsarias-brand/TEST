<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            grid-template-rows: 1.65fr 2fr 0.5fr;
            min-height: 100vh;
        }

        .top {
            background-image: url("IMG_9500.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .middle {
            background: #ffffff;
        }

        .bottom {
            background: #000000;
        }
    </style>
</head>

<body>

    <div class="top"></div>
    <div class="middle"></div>
    <div class="bottom"></div>

</body>
</html>
