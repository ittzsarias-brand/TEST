<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: 0.35fr 1.65fr 2fr 0.5fr;
        }

        .top-black {
            background: #000000;
        }

        .picture {
            background-image: url("IMG_9500.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .white {
            background: #ffffff;
        }

        .bottom-black {
            background: #000000;
        }
    </style>
</head>

<body>

    <div class="top-black"></div>

    <div class="picture"></div>

    <div class="white"></div>

    <div class="bottom-black"></div>

</body>
</html>
