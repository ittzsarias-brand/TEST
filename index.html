<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: grid;
            grid-template-rows: 2fr 2fr 0.5fr;
            min-height: 100vh;
        }

        .black-top {
            background: #000000;
        }

        .white {
            background: #ffffff;
        }

        .black-bottom {
            background: #000000;
        }
    </style>
</head>

<body>
    <div class="black-top"></div>
    <div class="white"></div>
    <div class="black-bottom"></div>
</body>
</html>
